name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v7
      - run: ./bin/setup-deps
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake spec
      - name: Build and install gem
        run: |
          mkdir -p pkg
          gem build relaunch.gemspec --output pkg/relaunch.gem
          gem install pkg/relaunch.gem --no-document
          rerun --version
          rerun --help
          relaunch --version
          relaunch --help
